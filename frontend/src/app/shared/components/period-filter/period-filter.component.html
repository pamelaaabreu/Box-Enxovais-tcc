<form [formGroup]="form()" (ngSubmit)="applied.emit()" aria-label="Filtrar indicadores por período">
<label>Período<mat-select panelClass="box-form-options box-admin-options" aria-label="Período" formControlName="period"><mat-option value="today">Hoje</mat-option><mat-option value="7d">Últimos 7 dias</mat-option><mat-option value="30d">Últimos 30 dias</mat-option><mat-option value="month">Este mês</mat-option><mat-option value="last_month">Mês anterior</mat-option><mat-option value="custom">Período personalizado</mat-option></mat-select></label>
@if(form().controls.period.value==='custom'){<label>Data inicial<input type="date" formControlName="dateFrom" required /></label><label>Data final<input type="date" formControlName="dateTo" required /></label>}
@if(showGrouping()){<label>Agrupamento<mat-select panelClass="box-form-options box-admin-options" aria-label="Agrupamento" formControlName="group"><mat-option value="auto">Automático</mat-option><mat-option value="day">Por dia</mat-option><mat-option value="month">Por mês</mat-option></mat-select></label>}
<button type="submit">Aplicar período</button>
</form>
