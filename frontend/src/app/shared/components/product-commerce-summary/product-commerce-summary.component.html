<section aria-label="Preço e estoque" class="commerce-summary" [class.embedded]="!framed">
  <h2>Preço e estoque</h2>
  <dl><div><dt>Preço inicial</dt><dd>{{ startingPrice }}</dd></div><div><dt>Estoque total</dt><dd>{{ totalStock }} {{ totalStock === 1 ? 'unidade' : 'unidades' }}</dd></div><div><dt>Variações</dt><dd>{{ variants.length }}</dd></div></dl>
  <p>Valores calculados automaticamente a partir das variações.</p>
 </section>
