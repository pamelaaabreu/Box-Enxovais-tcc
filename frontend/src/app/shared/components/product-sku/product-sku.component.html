<div class="sku-field" [class.compact]="compact">
  <label
    >SKU da loja<input
      readonly
      [value]="sku"
      [placeholder]="loading ? 'Consultando SKU…' : 'SKU indisponível'"
  /></label>
  @if (sku) {
    <button
      type="button"
      (click)="copy()"
      aria-label="Copiar SKU"
      title="Copiar SKU"
    >
      <mat-icon aria-hidden="true">content_copy</mat-icon>Copiar
    </button>
  }
  @if (failed) {
    <p role="status">
      Não foi possível consultar o SKU.
      <button type="button" (click)="load()">Tentar novamente</button>
    </p>
  }
</div>
