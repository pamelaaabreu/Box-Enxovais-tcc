<div
  class="alert-toast"
  [attr.role]="type === 'error' ? 'alert' : 'status'"
  aria-atomic="true"
  [attr.aria-live]="type === 'error' ? 'assertive' : 'polite'"
  [class.alert-recovery-success]="recoverySuccess"
  [class]="'alert-' + type"
  [class.toast-exit]="!visible"
>
  <div class="alert-icon" aria-hidden="true">
    <mat-icon [class.spinning]="type === 'loading'">{{ icons[type] }}</mat-icon>
  </div>

  <!-- Conteúdo -->
  <div class="alert-content">
    <h4 class="alert-title">{{ title }}</h4>
    <p class="alert-message" *ngIf="message">{{ message }}</p>
    @if (action) {
      <button type="button" class="alert-action" (click)="activate()">{{ action.label }}</button>
    }
  </div>

  <!-- Botão Fechar -->
  <button
    class="alert-close"
    type="button"
    *ngIf="showClose && type !== 'loading'"
    (click)="onClose()"
    aria-label="Fechar notificação"
  >
    <mat-icon aria-hidden="true">close</mat-icon>
  </button>

  <!-- Barra de Progresso -->
  <div aria-hidden="true" class="alert-progress" *ngIf="showProgress && duration > 0">
    <div
      class="progress-bar"
      [style.animation-duration]="duration + 'ms'"
    ></div>
  </div>
</div>
