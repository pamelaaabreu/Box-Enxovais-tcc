<section class="category-section" aria-labelledby="categories-heading"><h2 id="categories-heading">{{titulo}}</h2><div class="category-grid">@for(category of categories();track category.slug){<a [routerLink]="['/categoria',category.slug]" class="category-card">@if(category.imagePath){<img [src]="'http://localhost:8080/'+category.imagePath" [alt]="category.name" loading="lazy" />}<span>{{category.name}}</span></a>}</div></section>
