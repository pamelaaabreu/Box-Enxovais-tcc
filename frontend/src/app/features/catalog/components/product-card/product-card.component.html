<article [class.compact]="compact()">
  <app-favorite-button class="favorite-action" [productId]="product().id" [productName]="product().name" />
  <a
    class="product-link"
    [routerLink]="product().active ? ['/produto', product().slug] : null"
    [attr.aria-disabled]="!product().active"
    [attr.tabindex]="product().active ? null : -1"
    [attr.aria-label]="'Ver ' + product().name"
  >
    <div class="media">
      <app-product-media [image]="product().images[0] || null" [showCaption]="false" />
    </div>
    <div class="information">
      @if (!compact()) { <span class="category">{{ product().category.name }}</span> }
      <h2>{{ product().name }}</h2>
      @if (!product().active || product().quantity < 1) { <span class="unavailable">Produto indisponível</span> }
      <app-product-price
        [price]="product().price"
        [showInstallments]="!compact()"
      />
      @if (!compact()) { <span class="details"
        >{{ product().active ? 'Conhecer produto' : 'Produto indisponível' }} <span aria-hidden="true">→</span></span
      > }
    </div>
  </a>
</article>
