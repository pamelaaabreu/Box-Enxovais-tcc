<nav aria-label="Caminho de navegação">
  <ol>@for (item of items(); track $index; let last = $last) {
    <li>
      @if (item.url && !last) { <a [routerLink]="item.url">{{ item.label }}</a> }
      @else { <span [attr.aria-current]="last ? 'page' : null">{{ item.label }}</span> }
      @if (!last) { <mat-icon class="separator" aria-hidden="true">chevron_right</mat-icon> }
    </li>
  }</ol>
</nav>
