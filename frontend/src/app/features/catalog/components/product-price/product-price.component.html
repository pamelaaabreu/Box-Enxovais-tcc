@if (originalPrice() !== null && originalPrice()! > price()) {
  <del>{{
    originalPrice() | currency: "BRL" : "symbol" : "1.2-2" : "pt-BR"
  }}</del>
}
<strong>{{ price() | currency: "BRL" : "symbol" : "1.2-2" : "pt-BR" }}</strong>
@if (showInstallments()) {
  <span>{{ installmentLabel() }}</span>
}
