@if (reviews().length) {
  <section class="proof-section" aria-labelledby="reviews-title">
    <h2 id="reviews-title">Quem comprou, recomenda</h2>
    <div class="reviews-grid">
      @for (review of reviews(); track review.id) {
        <article>
          <p
            class="rating"
            role="img"
            [attr.aria-label]="review.rating + ' de 5 estrelas'"
          >
            @for (n of [1, 2, 3, 4, 5]; track n) {
              <mat-icon aria-hidden="true">{{
                n <= review.rating ? "star" : "star_border"
              }}</mat-icon>
            }
          </p>
          <blockquote>{{ review.comment }}</blockquote>
          <strong>{{ review.customerName }}</strong
          ><a
            [routerLink]="[
              '/produto',
              productSlug(review.productName, review.productId),
            ]"
            >{{ review.productName }}</a
          >
          <p>Compra verificada</p>
        </article>
      }
    </div>
  </section>
}
