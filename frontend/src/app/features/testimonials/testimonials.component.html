@if(reviews().length){<section class="proof-section" aria-labelledby="reviews-title"><h2 id="reviews-title">Experiências de quem comprou</h2><div class="reviews-grid">@for(review of reviews().slice(0,3);track review.id){<article><p class="rating" [attr.aria-label]="review.overall+' de 5 estrelas'">@for(n of [1,2,3,4,5];track n){<mat-icon aria-hidden="true">{{n<=review.overall?'star':'star_border'}}</mat-icon>}</p>@if(review.comment){<blockquote>{{review.comment}}</blockquote>}<p>Compra verificada</p></article>}</div></section>}
