<section
  class="manage-container"
  [class.with-summary]="selectedTabIndex === 0"
  [attr.aria-label]="editId ? 'Editar produto' : 'Cadastrar produto'"
>
  @if (productId && selectedTabIndex === 1) {
    <div class="saved-product-info"><app-product-sku [productId]="productId" /><a class="image-note" [routerLink]="['/admin/products',productId,'variants']">Gerenciar variações</a></div>
  }
  <mat-tab-group
    [(selectedIndex)]="selectedTabIndex"
    [preserveContent]="true"
    [mat-stretch-tabs]="true"
  >
    <mat-tab label="Dados do produto">
      @if (!productId) {
        <p class="image-note">
          A aba Imagens é liberada depois que você salvar os dados do produto.
        </p>
      }
      <app-product-create
        [externalSummary]="true"
        [editId]="editId"
        (productUpdated)="onProductUpdated()"
        (productLoaded)="onProductLoaded($event)"
        [previewImage]="previewImage"
        (productCreated)="onProductCreated($event)"
      />
    </mat-tab>
    <mat-tab [disabled]="!productId">
      <ng-template mat-tab-label>
        @if (!productId) {
          <mat-icon aria-hidden="true" class="tab-lock">lock_outline</mat-icon>
        }
        Imagens
      </ng-template>
      @if (productId; as id) {
        <div class="tab-content">
          <app-product-image-upload
            [productId]="id"
            [showComplete]="true"
            [editing]="!!editId"
            (completed)="complete()"
            (coverChanged)="previewImage = $event"
          />
        </div>
      }
    </mat-tab>
  </mat-tab-group>
  @if (selectedTabIndex === 0) {
    <ng-container [ngTemplateOutlet]="createForm()?.summary() ?? null" />
  }
</section>
