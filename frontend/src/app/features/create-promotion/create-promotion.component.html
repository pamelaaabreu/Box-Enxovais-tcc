<div class="promotion-form-container">
  <div class="form-header">
    <div class="header-icon">
      <mat-icon>campaign</mat-icon>
    </div>

    <div class="header-content">
      <h2>Criar Nova Promoção</h2>
      <p>Cadastre uma nova campanha promocional para sua loja.</p>
    </div>
  </div>

  <form #campaignForm="ngForm" (ngSubmit)="onSubmit()">
    <div class="form-group">
      <label for="promo-name">
        <mat-icon>local_offer</mat-icon>
        Nome da Promoção
      </label>

      <input
        type="text"
        id="promo-name"
        name="name" maxlength="255"
        placeholder="Ex: Black Friday 2026"
        [(ngModel)]="promotionData.name"
        required
      />
    </div>

    <div class="form-group">
      <label id="campaign-status-label">
        <mat-icon>toggle_on</mat-icon>
        Status
      </label>

      <mat-select id="status" name="status" [(ngModel)]="promotionData.status" aria-labelledby="campaign-status-label" panelClass="box-form-options">
        <mat-option value="active">Ativa</mat-option>
        <mat-option value="inactive">Inativa</mat-option>
      </mat-select>
    </div>

    <div class="form-group">
      <label for="start-date">
        <mat-icon>event_available</mat-icon>
        Data de Início
      </label>

      <input
        type="datetime-local"
        id="start-date"
        name="start-date"
        [(ngModel)]="promotionData.start_date"
        required
      />
    </div>

    <div class="form-group">
      <label for="end-date">
        <mat-icon>event_busy</mat-icon>
        Data de Fim
      </label>

      <input
        type="datetime-local"
        id="end-date"
        name="end-date"
        [(ngModel)]="promotionData.end_date"
        required
      />
    </div>
    <div class="form-group"><label for="campaign-description">Descrição da campanha</label><textarea id="campaign-description" name="description" maxlength="2000" [(ngModel)]="promotionData.description" [required]="!!promotionData.home_featured"></textarea></div>
    <div class="form-group"><label for="campaign-image">Imagem cadastrada (caminho uploads/arquivo.webp)</label><input id="campaign-image" name="image_path" [(ngModel)]="promotionData.image_path" [required]="!!promotionData.home_featured" placeholder="uploads/campanha-natal.webp" /></div>
    <div class="form-group"><label><input type="checkbox" name="home_featured" [(ngModel)]="promotionData.home_featured" /> Apresentar na Home durante a vigência</label></div>
    <div class="button-container">
      <button type="submit" [disabled]="saving || campaignForm.invalid">
        <mat-icon>add_circle</mat-icon>
        {{saving?'Salvando…':'Criar Promoção'}}
      </button>
    </div>
  </form>
</div>
