<section class="featured-section" aria-labelledby="featured-heading">
  <h2 id="featured-heading">{{ titulo }}</h2>
  @if (state().loading) {
    <p role="status">Carregando produtos…</p>
  } @else if (state().error) {
    <div role="alert">
      <p>{{ state().error }}</p>
      <button type="button" (click)="retry()">Tentar novamente</button>
    </div>
  } @else {
    <div class="featured-grid">
      @for (product of products(); track product.id) {
        <app-product-card
          [product]="catalog.adapt(product)"
          [catalogTile]="true"
          [homeTile]="true"
        />
      }
    </div>
    @if (!products().length) {
      <p>Nenhum produto disponível nesta seleção.</p>
    }
  }
</section>
