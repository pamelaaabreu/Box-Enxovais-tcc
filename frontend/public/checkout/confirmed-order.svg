<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 540 470">
  <defs>
    <linearGradient id="cardboard" x2=".85" y2="1">
      <stop stop-color="#e4c7a2"/><stop offset="1" stop-color="#bf9672"/>
    </linearGradient>
    <linearGradient id="linen" x2="0" y2="1">
      <stop stop-color="#fff8e9"/><stop offset="1" stop-color="#e4d3b5"/>
    </linearGradient>
    <linearGradient id="sage" x2="1" y2="1">
      <stop stop-color="#c1c9ab"/><stop offset="1" stop-color="#8d9a78"/>
    </linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .box { animation: rise 500ms ease-out both; }
      .flap { transform-box: fill-box; transform-origin: center bottom; animation: open 520ms ease-out 220ms both; }
      .textile { animation: rise 500ms ease-out 430ms both; }
      .seal { transform-box: fill-box; transform-origin: center; animation: seal-in 380ms ease-out 770ms both; }
      .check { stroke-dasharray: 1; animation: draw 450ms ease-out 1000ms both; }
    }
    @keyframes rise { from { opacity: 0; transform: translateY(13px); } }
    @keyframes open { from { opacity: .55; transform: scaleY(.68); } }
    @keyframes seal-in { from { opacity: 0; transform: scale(.85); } }
    @keyframes draw { from { stroke-dashoffset: 1; } to { stroke-dashoffset: 0; } }
  </style>
