<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Pedido cancelado | Box Enxovais</title>
  </head>

  <body
    style="
      margin: 0;
      padding: 0;
      background-color: #ffffff;
      color: #3d4836;
      font-family: Georgia, &quot;Times New Roman&quot;, serif;
      font-size: 15px;
      line-height: 1.6;
      -webkit-text-size-adjust: 100%;
      -ms-text-size-adjust: 100%;
    "
  >
    <!-- Fundo principal -->
    <table
      role="presentation"
      width="100%"
      border="0"
      cellspacing="0"
      cellpadding="0"
      style="width: 100%; border-collapse: collapse; background-color: #ffffff"
    >
      <tr>
        <td align="center" style="padding: 28px 12px">
          <!-- Card principal -->
          <table
            role="presentation"
            width="100%"
            border="0"
            cellspacing="0"
            cellpadding="0"
            style="
              width: 100%;
              max-width: 600px;
              border-collapse: separate;
              border-spacing: 0;
              background-color: #fffdf8;
              border: 1px solid #d7ddcf;
              border-radius: 14px;
              overflow: hidden;
            "
          >
            <!-- Cabeçalho -->
            <tr>
              <td
                align="center"
                style="
                  padding: 28px 24px;
                  background-color: #3f4e3c;
                  border-radius: 14px 14px 0 0;
                  text-align: center;
                "
              >
                <img
                  src="cid:checkout-logo-white.png"
                  width="140"
                  alt="Box Enxovais - Casa bem vivida"
                  style="
                    display: block;
                    width: 140px;
                    max-width: 100%;
                    height: auto;
                    margin: 0 auto;
                    border: 0;
                    outline: none;
                    text-decoration: none;
                  "
                />
              </td>
            </tr>

            <!-- Conteúdo -->
            <tr>
              <td style="padding: 40px 34px 38px; background-color: #fffdf8">
                <!-- Título -->
                <h1
                  style="
                    margin: 0 0 18px;
                    color: #33412f;
                    font-family: Georgia, &quot;Times New Roman&quot;, serif;
                    font-size: 27px;
                    font-weight: 700;
                    line-height: 1.35;
                  "
                >
                  Pedido #{{.Order.ID}} cancelado
                </h1>

                <!-- Mensagem -->
                <p
                  style="
                    margin: 0 0 28px;
                    color: #485143;
                    font-family: Georgia, &quot;Times New Roman&quot;, serif;
                    font-size: 15px;
                    font-weight: 400;
                    line-height: 1.9;
                  "
                >
                  Olá, {{.Name}}! Confirmamos o cancelamento do seu pedido.
                </p>

                <!-- Duas linhas decorativas delicadas -->
                <table
                  role="presentation"
                  width="100%"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    width: 100%;
                    margin: 8px 0 26px;
                    border-collapse: collapse;
                  "
                >
                  <tr>
                    <td
                      height="6"
                      style="
                        height: 6px;
                        font-size: 0;
                        line-height: 0;
                        border-top: 1px solid #cfd3c3;
                        border-bottom: 1px solid #e3e6dc;
                      "
                    >
                      &nbsp;
                    </td>
                  </tr>
                </table>

                <!-- Tabela de produtos -->
                <table
                  role="table"
                  width="100%"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    width: 100%;
                    border-collapse: collapse;
                    table-layout: fixed;
                    border: 1px solid #a7b19a;
                  "
                >
                  <!-- Cabeçalho da tabela -->
                  <thead>
                    <tr>
                      <th
                        scope="col"
                        width="72%"
                        align="left"
                        style="
                          padding: 15px 18px;
                          background-color: #eee9dd;
                          color: #3d4836;
                          font-family:
                            Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 12px;
                          font-weight: 700;
                          line-height: 1.5;
                          text-align: left;
                          text-transform: uppercase;
                          letter-spacing: 1px;
                          border-right: 1px solid #a7b19a;
                          border-bottom: 1px solid #a7b19a;
                        "
                      >
                        Produto
                      </th>

                      <th
                        scope="col"
                        width="28%"
                        align="center"
                        style="
                          padding: 15px 8px;
                          background-color: #eee9dd;
                          color: #3d4836;
                          font-family:
                            Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 12px;
                          font-weight: 700;
                          line-height: 1.5;
                          text-align: center;
                          text-transform: uppercase;
                          letter-spacing: 0.5px;
                          border-bottom: 1px solid #a7b19a;
                        "
                      >
                        Quantidade
                      </th>
                    </tr>
                  </thead>

                  <!-- Produtos dinâmicos -->
                  <tbody>
                    {{range .Order.ReceiptItems}}
                    <tr>
                      <td
                        align="left"
                        style="
                          padding: 22px 18px;
                          background-color: #fffaf1;
                          color: #3d4836;
                          font-family:
                            Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 14px;
                          font-weight: 400;
                          line-height: 1.8;
                          text-align: left;
                          vertical-align: middle;
                          border-right: 1px solid #a7b19a;
                          border-bottom: 1px solid #a7b19a;
                          overflow-wrap: break-word;
                          word-wrap: break-word;
                        "
                      >
                        {{.Name}}
                      </td>

                      <td
                        align="center"
                        style="
                          padding: 22px 8px;
                          background-color: #fffaf1;
                          color: #3d4836;
                          font-family:
                            Georgia, &quot;Times New Roman&quot;, serif;
                          font-size: 14px;
                          font-weight: 400;
                          line-height: 1.8;
                          text-align: center;
                          vertical-align: middle;
                          border-bottom: 1px solid #a7b19a;
                        "
                      >
                        {{.Quantity}}
                      </td>
                    </tr>
                    {{end}}
                  </tbody>
                </table>

                <!-- Total do pedido -->
                <table
                  role="presentation"
                  width="100%"
                  border="0"
                  cellspacing="0"
                  cellpadding="0"
                  style="
                    width: 100%;
                    margin-top: 28px;
                    border-collapse: collapse;
                  "
                >
                  <tr>
                    <td
                      width="50%"
                      align="left"
                      style="
                        padding: 24px 20px;
                        background-color: #3f4e3c;
                        color: #ffffff;
                        font-family:
                          Georgia, &quot;Times New Roman&quot;, serif;
                        font-size: 16px;
                        font-weight: 700;
                        line-height: 1.5;
                        text-align: left;
                        vertical-align: middle;
                        border-right: 1px solid #73806a;
                      "
                    >
                      Total do pedido
                    </td>

                    <td
                      width="50%"
                      align="right"
                      style="
                        padding: 24px 20px;
                        background-color: #3f4e3c;
                        color: #ffffff;
                        font-family:
                          Georgia, &quot;Times New Roman&quot;, serif;
                        font-size: 22px;
                        font-weight: 700;
                        line-height: 1.4;
                        text-align: right;
                        vertical-align: middle;
                        white-space: nowrap;
                      "
                    >
                      {{money .Order.Total}}
                    </td>
                  </tr>
                </table>
              </td>
            </tr>

            <!-- Rodapé -->
            <tr>
              <td
                align="center"
                style="
                  padding: 26px 20px;
                  background-color: #3f4e3c;
                  border-radius: 0 0 14px 14px;
                  color: #ffffff;
                  font-family: Georgia, &quot;Times New Roman&quot;, serif;
                  font-size: 12px;
                  font-weight: 400;
                  line-height: 1.7;
                  text-align: center;
                "
              >
                Este é um e-mail automático. Por favor, não responda.
              </td>
            </tr>
          </table>
          <!-- Fim do card principal -->
        </td>
      </tr>
    </table>
  </body>
</html>
